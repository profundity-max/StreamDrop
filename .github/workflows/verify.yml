name: Verify macOS App
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Prepare media tools on the CI runner
        run: |
          for tool in ffmpeg yt-dlp; do
            command -v "$tool" >/dev/null || brew install "$tool"
          done
          swift --version
          ffmpeg -version
          yt-dlp --version
      - name: Verify release records and gates
        run: |
          /usr/bin/python3 scripts/check-release.py
          /usr/bin/python3 -O scripts/check-release.py
          /usr/bin/python3 scripts/test-release-records.py
          /usr/bin/python3 scripts/test-test-gate.py
      - name: Run all download regressions without skips
        run: /usr/bin/python3 scripts/test.py --require-tools
      - name: Build universal App and verify package
        run: |
          ./scripts/build.sh
          /usr/bin/python3 scripts/check-release.py --built
          codesign --verify --deep --strict output/StreamDrop.app
          hdiutil verify output/StreamDrop.dmg
      - name: Verify release tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: /usr/bin/python3 scripts/check-release.py --built --tag
      - name: Retain verification logs
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: verification-${{ github.sha }}
          path: .test-output/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
